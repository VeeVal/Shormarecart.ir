name: Bug report
description: Report a reproducible problem using fictional data only
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ShomareCart. Never include real card details, banking credentials, transaction data, private URLs, or personal information. Report security vulnerabilities privately according to SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence using fictional data.
      placeholder: |
        1. Open …
        2. Enter fictional value …
        3. Select …
        4. Observe …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport/device, locale, and LTR/RTL mode where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add redacted logs or screenshots containing fictional data only.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no real payment, personal, credential, secret, or private-link data.
          required: true
        - label: This is not a security vulnerability that should be reported privately.
          required: true
